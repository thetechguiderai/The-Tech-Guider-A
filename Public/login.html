<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — The Tech Guider AI</title>
<link rel="icon" href="./logo.png">
<link rel="stylesheet" href="./style.css">
</head>
<body class="landing">
<header class="nav">
  <a href="/" class="logo"><img src="./logo.png" class="logo-img" alt="logo">The Tech Guider AI</a>
  <div></div>
  <div class="nav-actions"><a href="./signup.html" class="btn btn-ghost">Create account</a></div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-sub">Sign in to continue.</p>
    <div class="form-error" id="formError" style="display:none;"></div>
    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" name="email" required></div>
      <div class="field"><label>Password</label><input type="password" name="password" required></div>
      <button class="btn btn-primary btn-block" type="submit">Sign In</button>
    </form>
    <div class="auth-divider"><span>or</span></div>
    <a class="btn oauth-btn btn-block" href="/api/auth/google"><span>G</span> Continue with Google</a>
    <p class="auth-alt">No account? <a href="./signup.html">Sign up</a></p>
    <p class="auth-alt"><a href="./chat.html">Continue as guest →</a></p>
  </div>
</div>

<script>
const oauthMessage = new URLSearchParams(location.search).get("oauth");
if (oauthMessage && oauthMessage !== "success") {
  const box = document.getElementById("formError");
  box.textContent = oauthMessage === "unavailable" ? "Google sign-in has not been configured yet." : "Google sign-in could not be completed. Please try again.";
  box.style.display = "block";
}
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errBox = document.getElementById("formError");
  errBox.style.display = "none";
  const formData = new FormData(e.target);
  const dataObj = Object.fromEntries(formData.entries());
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(dataObj),
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || "Failed to sign in");
    window.location.href = "/chat.html";
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = "block";
  }
});
</script>
</body>
</html>
