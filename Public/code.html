<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code — The Tech Guider AI</title><link rel="icon" href="./logo.png"><link rel="stylesheet" href="./style.css"></head><body class="app code-workspace">
<header class="workspace-head"><a class="brand" href="./chat.html"><img src="./logo.png" class="logo-img" alt="">The Tech Guider AI <span>/ Code</span></a><div class="workspace-actions"><button class="btn btn-ghost" id="saveBtn">Save</button><button class="btn btn-ghost" id="downloadBtn">Download</button><button class="btn btn-primary" id="runBtn">Run</button></div></header>
<main class="code-studio"><aside class="file-explorer"><b>EXPLORER</b><button class="file active">⌘ index.html</button><button class="file"># styles.css</button><button class="file">JS app.js</button><small>Local browser workspace</small></aside><section class="editor-pane"><div class="editor-tabs"><span>index.html</span><button id="formatBtn">Format</button></div><textarea id="codeEditor" spellcheck="false" aria-label="Code editor"></textarea><div class="terminal"><b>OUTPUT</b><span id="output">Ready. Edit your project, then run the preview.</span></div></section><aside class="ai-code-panel"><p class="eyebrow">GUIDER GO</p><h2>Code with AI</h2><p>Describe a feature, a fix, or an edit. The result is placed in your editor only when it is returned.</p><textarea id="aiPrompt" placeholder="Add a responsive pricing section…"></textarea><button class="btn btn-primary btn-block" id="askAi">Ask Guider</button><small id="aiStatus"></small></aside><section class="preview-panel code-preview"><div class="editor-label">LIVE PREVIEW <span>Sandboxed</span></div><iframe id="preview" title="Website preview" sandbox="allow-scripts"></iframe></section></main>
<script>const e=document.querySelector('#codeEditor'),f=document.querySelector('#preview'),out=document.querySelector('#output'),draft=localStorage.getItem('tg_code_draft');e.value=draft||'<!doctype html>\n<html><head><style>body{font-family:system-ui;padding:48px;background:#111;color:#fff}</style></head><body><h1>Start building</h1><p>Your project preview appears here.</p></body></html>';function run(){localStorage.setItem('tg_code_draft',e.value);f.srcdoc=e.value;out.textContent='Preview updated.'}document.querySelector('#runBtn').onclick=run;document.querySelector('#saveBtn').onclick=()=>{localStorage.setItem('tg_code_draft',e.value);out.textContent='Saved locally.'};document.querySelector('#formatBtn').onclick=()=>{e.value=e.value.replace(/>\s*</g,'>\n<');run()};document.querySelector('#downloadBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([e.value],{type:'text/html'}));a.download='index.html';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#askAi').onclick=async()=>{const p=document.querySelector('#aiPrompt').value.trim(),s=document.querySelector('#aiStatus');if(!p)return;s.textContent='Working…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({modelId:'guider-go',message:`Return only a complete HTML document with embedded CSS and JavaScript. Apply this requested change to the existing project:\n${p}\n\nExisting code:\n${e.value}`})}),d=await r.json();if(!r.ok)throw Error(d.error);e.value=d.reply.replace(/^\`\`\`(?:html)?\s*|\`\`\`$/g,'');run();s.textContent='Applied to editor.'}catch(x){s.textContent=x.message}};e.oninput=()=>localStorage.setItem('tg_code_draft',e.value);run()</script></body></html>
