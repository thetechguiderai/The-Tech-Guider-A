<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code — The Tech Guider AI</title><link rel="icon" href="./logo.png"><link rel="stylesheet" href="./style.css"></head><body class="app code-v2"><header class="ide-top"><a href="./chat.html" class="ide-mark"><img src="./logo.png" alt="The Tech Guider AI"></a><nav><button>File</button><button>Edit</button><button>Selection</button><button>View</button><button>Go</button><button>Terminal</button><button>Help</button></nav><label class="global-search">⌕ <input placeholder="Search project"></label><div><button class="integration">⌘ Integration</button><button class="ide-deploy" title="Deployment integration is not connected">↗ Deploy</button></div></header><main class="ide-shell"><aside class="ide-ai"><div class="ide-ai-tabs"><button class="active">◯ Chat</button><button>✧ Design</button></div><div class="ide-response"><p class="eyebrow">✦ THOUGHTS</p><p id="aiReply">Sign in to ask Guider to edit your project. Changes are shown for review before they are applied.</p></div><section class="ide-diff" id="diffCard" hidden><header><b>index.html</b><button id="revertCode">Revert</button></header><pre id="diffPreview"></pre></section><div class="ide-apply" id="applyRow" hidden><span>Edited 1 file <i>+42 −8</i></span><button id="applyCode">Apply changes ↵</button></div><form class="ide-composer" id="codeForm"><textarea id="aiPrompt" rows="2" placeholder="Ask a follow-up…"></textarea><div><select id="codeModel" aria-label="Choose model"></select><button type="button" id="codeAttach" title="Attach file">⌇</button><button type="button" id="codeVoice" title="Voice input">◉</button><button aria-label="Send request">↑</button></div></form></aside><aside class="ide-files"><header><b>EXPLORER</b><button id="newFile" title="New file">＋</button></header><div id="fileTree"></div></aside><section class="ide-editor"><div class="editor-tabbar"><button class="editor-tab active" id="tabName">⌘ index.html <i>×</i></button><button class="new-tab" id="formatBtn">Format</button></div><div class="code-area"><div class="line-numbers" id="lineNumbers"></div><textarea id="codeEditor" spellcheck="false" aria-label="Code editor"></textarea></div><section class="ide-terminal"><header><button>Debug Console</button><button>Outputs</button><button class="active">Terminal</button><button>Problems</button><span></span><button id="clearTerminal">×</button></header><pre id="terminalOutput">The Tech Guider AI workspace ready.
› Edit your project or ask Guider for a change.
› Preview updates are saved locally.</pre></section></section></main><input id="codeFile" type="file" accept=".txt,.md,.html,.css,.js" hidden><script>const $=s=>document.querySelector(s),editor=$('#codeEditor'),numbers=$('#lineNumbers'),output=$('#terminalOutput');let before='',draft=localStorage.getItem('tg_code_draft')||'<!doctype html>\n<html>\n  <head>\n    <title>My Guider project</title>\n  </head>\n  <body>\n    <main>Start building with The Tech Guider AI.</main>\n  </body>\n</html>';editor.value=draft;function lines(){numbers.textContent=editor.value.split('\n').map((_,i)=>i+1).join('\n')}function save(){localStorage.setItem('tg_code_draft',editor.value);lines()}function tree(){const names=['▾  assets/','    ◇ logo.png','▾  src/','    ▸ components/','    ▸ pages/','    ◇ App.tsx','⌘  index.html','＃  style.css','JS  app.js','{}  package.json'];$('#fileTree').innerHTML=names.map((x,i)=>`<button class="tree-file ${i===6?'active':''}" data-name="${x.trim().replace(/^.*\s/,'')}">${x}</button>`).join('');document.querySelectorAll('.tree-file').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tree-file').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#tabName').innerHTML='⌘ '+b.dataset.name+' <i>×</i>'})}async function models(){try{const r=await fetch('/api/models',{credentials:'include'}),d=await r.json();$('#codeModel').innerHTML=d.models.map(m=>`<option value="${m.id}" ${m.locked?'disabled':''}>${m.locked?'🔒 ':''}${m.name}</option>`).join('')}catch{$('#codeModel').innerHTML='<option value="guider-flash">Guider Flash</option>'}}$('#codeForm').onsubmit=async e=>{e.preventDefault();const p=$('#aiPrompt').value.trim();if(!p)return;$('#aiReply').textContent='Thinking through your requested change…';try{const r=await fetch('/api/chat',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({modelId:$('#codeModel').value,message:`Return only a complete HTML document with embedded CSS and JS. Apply this request: ${p}\n\nExisting project:\n${editor.value}`})}),d=await r.json();if(!r.ok)throw Error(d.error);before=editor.value;const next=d.reply.replace(/^\s*```(?:html)?\s*|\s*```\s*$/g,'');$('#diffPreview').textContent='− Current project\n+ Proposed update ready for review';$('#diffCard').hidden=false;$('#applyRow').hidden=false;$('#applyCode').onclick=()=>{editor.value=next;save();$('#diffCard').hidden=true;$('#applyRow').hidden=true;$('#aiReply').textContent='Applied the update to index.html and saved it as your local project draft.';output.textContent+='\n✓ Applied Guider change to index.html.'};$('#aiReply').textContent='I prepared a proposed change. Review it below, then apply it to the editor.'}catch(x){$('#aiReply').textContent=x.message}};$('#revertCode').onclick=()=>{editor.value=before;save();$('#diffCard').hidden=true;$('#applyRow').hidden=true};editor.oninput=save;editor.onscroll=()=>numbers.scrollTop=editor.scrollTop;$('#formatBtn').onclick=()=>{editor.value=editor.value.replace(/>\s*</g,'>\n<');save();output.textContent+='\n✓ Formatted index.html.'};$('#newFile').onclick=()=>{const name=prompt('File name');if(name){const b=document.createElement('button');b.className='tree-file';b.textContent='◇  '+name;$('#fileTree').append(b)}};$('#clearTerminal').onclick=()=>output.textContent='Terminal cleared.';$('#codeAttach').onclick=()=>$('#codeFile').click();$('#codeFile').onchange=async e=>{const f=e.target.files[0];if(f)$('#aiPrompt').value+=' Attached '+f.name+': '+(await f.text()).slice(0,5000)};$('#codeVoice').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Voice input is supported in Chrome and Edge.');const r=new R();r.onresult=e=>{$('#aiPrompt').value=e.results[0][0].transcript};r.start()};let workspaceUser=null;async function workspaceAuth(){try{workspaceUser=(await fetch('/api/auth/me',{credentials:'include'}).then(r=>r.json())).user}catch{} }document.addEventListener('click',e=>{const button=e.target.closest('button');if(button&&!workspaceUser){e.preventDefault();e.stopImmediatePropagation();alert('Sign up to use Code.');location.assign('./signup.html?next='+encodeURIComponent(location.pathname));}},true);workspaceAuth();tree();models();lines();</script></body></html>
