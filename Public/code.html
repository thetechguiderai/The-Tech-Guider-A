<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code — The Tech Guider AI</title><link rel="stylesheet" href="./style.css"></head><body class="app"><main class="code-page"><header class="code-head"><a class="brand" href="./chat.html"><img src="./logo.png" class="logo-img" alt="logo">The Tech Guider <span> / Code</span></a><div><button class="btn btn-ghost" id="formatBtn">Format</button><button class="btn btn-primary" id="runBtn">Run preview</button></div></header><div class="code-grid"><section><div class="editor-label">index.html <span>Autosaved locally</span></div><textarea id="codeEditor" spellcheck="false"></textarea></section><section class="preview-panel"><div class="editor-label">Preview</div><iframe id="preview" title="Website preview" sandbox="allow-scripts"></iframe></section></div></main><script>const e=document.querySelector('#codeEditor'),f=document.querySelector('#preview');e.value=localStorage.getItem('tg_code_draft')||'<!doctype html>\n<html>\n  <body>\n    <h1>Start building</h1>\n  </body>\n</html>';const run=()=>{localStorage.setItem('tg_code_draft',e.value);f.srcdoc=e.value};document.querySelector('#runBtn').onclick=run;document.querySelector('#formatBtn').onclick=()=>{e.value=e.value.replace(/>\s*</g,'>\n<');run()};e.oninput=()=>localStorage.setItem('tg_code_draft',e.value);run();</script></body></html>
