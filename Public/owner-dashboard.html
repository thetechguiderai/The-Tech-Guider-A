<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Console — The Tech Guider AI</title><link rel="icon" href="./logo.png"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="/owner.css"></head><body class="owner-app"><aside class="owner-sidebar"><a class="owner-brand" href="/chat.html"><img src="/logo.png" alt="">The Tech Guider AI</a><p>OWNER CONSOLE</p><nav id="ownerNav"><button class="active" data-view="overview">Overview</button><button data-view="users">Users</button><button data-view="models">Models</button><button data-view="plans">Plans</button><button data-view="usage">Usage &amp; Limits</button><button data-view="payments">Payments</button><button data-view="announcements">Announcements</button><button data-view="system">System</button><button data-view="audit">Audit log</button><button data-view="assistant">Owner Assistant</button></nav><a class="owner-back" href="/chat.html">← Back to workspace</a></aside><main class="owner-main"><header><div><p>OWNER CONSOLE</p><h1 id="ownerTitle">Overview</h1></div><div class="system-pill" id="systemPill">Loading…</div></header><div id="ownerNotice" role="alert" hidden></div><section id="ownerContent" aria-live="polite"><div class="owner-loading">Loading owner data…</div></section></main>
<script>
const $=s=>document.querySelector(s),content=$('#ownerContent'),notice=$('#ownerNotice'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt}),t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{throw Error('Invalid server response.')}if(!r.ok)throw Error(d.error||'Request failed.');return d}
function flash(m,bad=false){notice.hidden=false;notice.className=bad?'error':'';notice.textContent=m;setTimeout(()=>notice.hidden=true,4000)}
function tbl(h,rows){return '<div class="owner-table"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(rows||'<tr><td class="empty" colspan="'+h.length+'">No records yet.</td></tr>')+'</tbody></table></div>'}
function cards(items){return '<div class="owner-cards">'+items.map(x=>'<article class="owner-card"><span>'+esc(x[0])+'</span><strong>'+esc(x[1])+'</strong><small>'+esc(x[2]||'')+'</small></article>').join('')+'</div>'}
async function overview(){const d=await api('/api/owner/overview');$('#systemPill').textContent=d.systemStatus==='maintenance'?'Maintenance mode':'Operational';$('#systemPill').className='system-pill '+d.systemStatus;content.innerHTML=cards([['Total users',d.totalUsers,d.newUsers+' new in 30 days'],['Active users',d.activeUsers,'Last 30 days'],['Guest usage',d.guests,'Anonymous request identities'],['Conversations',d.chats,'Stored chats'],['AI requests',d.totalRequests,'All logged requests'],['Revenue','PKR '+d.revenue,d.payments+' real payment records']])+'<div class="owner-grid"><section class="owner-panel"><h2>Plan distribution</h2>'+tbl(['Plan','Users'],d.planDistribution.map(x=>'<tr><td>'+esc(x.plan)+'</td><td>'+x.count+'</td></tr>').join(''))+'</section><section class="owner-panel"><h2>Model usage</h2>'+tbl(['Model','Requests'],d.modelUsage.map(x=>'<tr><td>'+esc(x.model)+'</td><td>'+x.count+'</td></tr>').join(''))+'</section></div><section class="owner-panel"><h2>Recent activity</h2>'+tbl(['Type','Item','Status','When'],d.recentActivity.map(x=>'<tr><td>'+esc(x.type)+'</td><td>'+esc(x.label)+'</td><td>'+esc(x.detail)+'</td><td>'+esc(x.created_at)+'</td></tr>').join(''))+'</section>'}
async function users(){content.innerHTML='<section class="owner-panel"><div class="panel-head"><h2>Users</h2><input id="userSearch" placeholder="Search email or name"></div><div id="usersTable" class="owner-loading">Loading users…</div></section>';const load=async()=>{const d=await api('/api/owner/users?q='+encodeURIComponent($('#userSearch').value));$('#usersTable').innerHTML=tbl(['User','Plan','Usage','Chats','Status','Joined',''],d.users.map(u=>'<tr><td><b>'+esc(u.name||'—')+'</b><small>'+esc(u.email)+'</small></td><td>'+esc(u.plan)+'</td><td>'+u.usage+'</td><td>'+u.chats+'</td><td>'+(u.disabled?'Disabled':'Active')+'</td><td>'+esc(u.created_at)+'</td><td><button data-user="'+u.id+'">Details</button></td></tr>').join(''));document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>userDetail(b.dataset.user))};$('#userSearch').oninput=()=>{clearTimeout(window.ut);window.ut=setTimeout(load,250)};await load()}
async function userDetail(id){const d=await api('/api/owner/users/'+id),u=d.user;content.innerHTML='<section class="owner-panel"><button data-back>← Users</button><h2>'+esc(u.name||u.email)+'</h2><div class="detail-grid"><span>Email<b>'+esc(u.email)+'</b></span><span>Plan<b>'+esc(u.plan)+'</b></span><span>Status<b>'+(u.disabled?'Disabled':'Active')+'</b></span><span>Joined<b>'+esc(u.created_at)+'</b></span></div><button class="'+(u.disabled?'':'danger')+'" id="statusBtn">'+(u.disabled?'Enable user':'Disable user')+'</button></section><section class="owner-panel"><h2>Usage by model</h2>'+tbl(['Model','Usage'],d.usage.map(x=>'<tr><td>'+esc(x.model)+'</td><td>'+x.count+'</td></tr>').join(''))+'</section>'; $('[data-back]').onclick=users;$('#statusBtn').onclick=async()=>{if(confirm((u.disabled?'Enable':'Disable')+' this account?')){await api('/api/owner/users/'+id,{method:'PATCH',body:JSON.stringify({disabled:!u.disabled})});flash('User status updated.');userDetail(id)}}}
async function models(){const d=await api('/api/owner/models');content.innerHTML='<section class="owner-panel"><h2>Models</h2>'+tbl(['Model','Enabled','Tier','Daily limit','Save'],d.models.map(m=>'<tr><td><b>'+esc(m.name)+'</b><small>'+esc(m.id)+'</small></td><td><input type="checkbox" data-enabled="'+m.id+'" '+(m.enabled?'checked':'')+'></td><td><select data-tier="'+m.id+'">'+['free','paid','guest'].map(x=>'<option '+(m.tier===x?'selected':'')+'>'+x+'</option>').join('')+'</select></td><td><input type="number" min="0" data-limit="'+m.id+'" value="'+m.dailyLimit+'"></td><td><button data-model="'+m.id+'">Save</button></td></tr>').join(''))+'</section>';document.querySelectorAll('[data-model]').forEach(b=>b.onclick=async()=>{const id=b.dataset.model;await api('/api/owner/models/'+id,{method:'PATCH',body:JSON.stringify({enabled:$('[data-enabled="'+id+'"]').checked,tier:$('[data-tier="'+id+'"]').value,dailyLimit:Number($('[data-limit="'+id+'"]').value)})});flash('Model updated.');models()})}
async function plans(){const d=await api('/api/owner/plans');content.innerHTML='<section class="owner-panel"><h2>Plans</h2>'+tbl(['Plan','Monthly','Yearly','Enabled','Limit','Features','Save'],d.plans.filter(p=>p.id!=='free').map(p=>'<tr><td><b>'+esc(p.name)+'</b><small>'+esc(p.id)+'</small></td><td><input type="number" min="0" data-monthly="'+p.id+'" value="'+p.monthly+'"></td><td><input type="number" min="0" data-yearly="'+p.id+'" value="'+p.yearly+'"></td><td><input type="checkbox" data-plan-enabled="'+p.id+'" '+(p.enabled?'checked':'')+'></td><td><input type="number" min="0" data-plan-limit="'+p.id+'" value="'+(p.dailyLimit??'')+'"></td><td><small>'+esc(p.features.join(', '))+'</small></td><td><button data-plan="'+p.id+'">Save</button></td></tr>').join(''))+'</section>';document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=async()=>{const id=b.dataset.plan,l=$('[data-plan-limit="'+id+'"]').value;await api('/api/owner/plans/'+id,{method:'PATCH',body:JSON.stringify({monthly:Number($('[data-monthly="'+id+'"]').value),yearly:Number($('[data-yearly="'+id+'"]').value),enabled:$('[data-plan-enabled="'+id+'"]').checked,dailyLimit:l===''?null:Number(l)})});flash('Plan updated.');plans()})}
async function usage(){const d=await api('/api/owner/usage');content.innerHTML='<section class="owner-panel"><h2>Usage &amp; limits</h2>'+tbl(['User ID','Model','Requests','Last day'],d.usage.map(x=>'<tr><td>'+esc(x.user_id||'Guest')+'</td><td>'+esc(x.model)+'</td><td>'+x.count+'</td><td>'+esc(x.last_day)+'</td></tr>').join(''))+'<p class="owner-note">Actual usage only. Model and plan limits are managed in their sections.</p></section>'}
async function payments(){const d=await api('/api/owner/payments');content.innerHTML=cards(d.totals.map(x=>[(x.status||'unknown')+' payments',x.count,'PKR '+x.amount]))+'<section class="owner-panel"><h2>Transaction history</h2>'+tbl(['User','Plan','Amount','Status','When'],d.payments.map(x=>'<tr><td>'+esc(x.email||x.user_id)+'</td><td>'+esc(x.plan)+'</td><td>PKR '+(x.amount||0)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.created_at)+'</td></tr>').join(''))+'<p class="owner-note">Only stored payment events are shown. No payment events are invented.</p></section>'}
async function announcements(){const d=await api('/api/owner/announcements');content.innerHTML='<section class="owner-panel"><h2>Create announcement</h2><form id="annForm" class="owner-form"><input name="title" placeholder="Title" maxlength="120" required><textarea name="body" placeholder="Message" maxlength="2000" required></textarea><button>Publish</button></form></section><section class="owner-panel"><h2>Published announcements</h2>'+d.announcements.map(a=>'<article class="announcement-admin"><input data-at="'+a.id+'" value="'+esc(a.title)+'"><textarea data-ab="'+a.id+'">'+esc(a.body)+'</textarea><small>'+esc(a.created_at)+'</small><div><button data-as="'+a.id+'">Save</button><button class="danger" data-ad="'+a.id+'">Delete</button></div></article>').join('')+'</section>';$('#annForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api('/api/announcements',{method:'POST',body:JSON.stringify({title:f.get('title'),body:f.get('body')})});flash('Announcement published.');announcements()};document.querySelectorAll('[data-as]').forEach(b=>b.onclick=async()=>{const id=b.dataset.as;await api('/api/owner/announcements/'+id,{method:'PATCH',body:JSON.stringify({title:$('[data-at="'+id+'"]').value,body:$('[data-ab="'+id+'"]').value})});flash('Announcement saved.')});document.querySelectorAll('[data-ad]').forEach(b=>b.onclick=async()=>{if(confirm('Delete announcement?')){await api('/api/owner/announcements/'+b.dataset.ad,{method:'DELETE'});flash('Announcement deleted.');announcements()}})}
async function system(){const d=await api('/api/owner/maintenance');content.innerHTML='<section class="owner-panel system-panel"><h2>Maintenance mode</h2><p>Normal chat and image generation requests receive a maintenance response. The configured owner can still administer the service.</p><label class="switch"><input id="maintenance" type="checkbox" '+(d.enabled?'checked':'')+'><span></span> '+(d.enabled?'Maintenance enabled':'System operational')+'</label><button id="maintenanceSave">Save maintenance setting</button></section>';$('#maintenanceSave').onclick=async()=>{const enabled=$('#maintenance').checked;if(confirm((enabled?'Enable':'Disable')+' maintenance mode?')){await api('/api/owner/maintenance',{method:'PATCH',body:JSON.stringify({enabled})});flash('Maintenance setting updated.');system()}}}
async function audit(){const d=await api('/api/owner/audit');content.innerHTML='<section class="owner-panel"><h2>Audit log</h2>'+tbl(['Action','Target','Owner','When'],d.audit.map(x=>'<tr><td>'+esc(x.action)+'</td><td>'+esc(x.target||'—')+'</td><td>'+esc(x.owner_email||'—')+'</td><td>'+esc(x.created_at)+'</td></tr>').join(''))+'</section>'}
async function assistant(){const d=await api('/api/owner/assistant/history');content.innerHTML='<section class="owner-panel owner-assistant"><h2>Owner AI Assistant</h2><p>Private owner-only operational assistant, isolated from user conversations.</p><div id="assistantMessages">'+(d.messages.map(m=>'<article class="'+m.role+'">'+esc(m.content)+'</article>').join('')||'<p class="empty">Ask about operations, models, plans, or safety.</p>')+'</div><form id="assistantForm" class="owner-form"><textarea name="message" placeholder="Ask the Owner Assistant…" required></textarea><button>Send</button></form></section>';$('#assistantForm').onsubmit=async e=>{e.preventDefault();const text=new FormData(e.target).get('message');e.target.reset();try{await api('/api/owner/assistant',{method:'POST',body:JSON.stringify({message:text})});assistant()}catch(err){flash(err.message,true)}}}
const views={overview,users,models,plans,usage,payments,announcements,system,audit,assistant};async function show(v){$('#ownerTitle').textContent=document.querySelector('[data-view="'+v+'"]').textContent;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));content.innerHTML='<div class="owner-loading">Loading…</div>';try{await views[v]()}catch(e){content.innerHTML='<div class="owner-error">'+esc(e.message)+'</div>';if(e.message.includes('Owner access'))location.assign('/login.html')}}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));show('overview');
</script></body></html>
