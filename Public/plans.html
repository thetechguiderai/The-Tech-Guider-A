<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Plans — The Tech Guider AI</title><link rel="icon" href="./logo.png"><link rel="stylesheet" href="./style.css"></head>
<body class="landing"><header class="nav"><a href="/" class="logo"><img src="./logo.png" class="logo-img" alt="The Tech Guider AI">The Tech Guider AI</a><div class="nav-actions"><a href="./chat.html" class="btn btn-ghost">Back to workspace</a></div></header>
<main class="section-block"><p class="section-label">PRICING</p><h1 class="section-title">Simple plans. More capability.</h1><div class="billing-switch" role="group" aria-label="Billing interval"><button class="btn btn-primary" data-billing="monthly">Monthly</button><button class="btn btn-ghost" data-billing="yearly">Yearly</button></div><div class="plans-grid" id="plansGrid">Loading plans…</div></main>
<script>let billing='monthly';async function load(){const grid=document.getElementById('plansGrid');try{const res=await fetch('/api/plans'),{plans}=await res.json();grid.innerHTML=plans.map(p=>`<article class="plan-card ${p.id==='pro'?'recommended':''}"><h2>${p.name}</h2><div class="price">PKR ${billing==='monthly'?p.monthly:p.yearly}<span>/${billing==='monthly'?'month':'year'}</span></div><div class="price-yearly">${billing==='monthly'?`or PKR ${p.yearly}/year`:'Billed annually'}</div><p>${p.desc}</p><button class="btn ${p.id==='pro'?'btn-primary':'btn-ghost'} btn-block" data-plan="${p.id}">Choose ${p.name}</button></article>`).join('');grid.querySelectorAll('[data-plan]').forEach(btn=>btn.addEventListener('click',async()=>{const res=await fetch('/api/billing/checkout',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({planId:btn.dataset.plan})}),data=await res.json();alert(data.error||'Redirecting to checkout…')}))}catch{grid.textContent='Plans could not be loaded. Please refresh and try again.'}}document.querySelectorAll('[data-billing]').forEach(button=>button.addEventListener('click',()=>{billing=button.dataset.billing;document.querySelectorAll('[data-billing]').forEach(item=>item.className=`btn ${item===button?'btn-primary':'btn-ghost'}`);load()}));load()</script></body></html>
