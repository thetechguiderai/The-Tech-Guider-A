<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build — The Tech Guider AI</title><link rel="icon" href="./logo.png"><link rel="stylesheet" href="./style.css"></head><body class="app build-workspace">
<header class="workspace-head"><a class="brand" href="./chat.html"><img src="./logo.png" class="logo-img" alt="">The Tech Guider AI <span>/ Build</span></a><div class="workspace-actions"><button class="btn btn-ghost" id="undo">Undo</button><button class="btn btn-ghost" id="save">Save</button><button class="btn btn-ghost" id="export">Export</button><button class="btn btn-primary" id="publish" disabled title="Publishing requires a deployment connection">Publish</button></div></header>
<main class="builder-studio"><aside class="builder-left"><div class="builder-tabs"><button class="active" data-tab="ai">Build with AI</button><button data-tab="manual">Manual</button></div><div id="aiPanel"><p class="eyebrow">AI WEBSITE BUILDER</p><h2>What should we build?</h2><textarea id="buildPrompt" placeholder="A premium portfolio for a freelance designer with a dark hero, work, pricing and contact."></textarea><button class="btn btn-primary btn-block" id="buildBtn">Generate website</button><small id="buildStatus"></small></div><div id="manualPanel" hidden><p class="eyebrow">COMPONENTS</p><div class="component-grid"><button data-component="nav">Navbar</button><button data-component="hero">Hero</button><button data-component="cards">Cards</button><button data-component="pricing">Pricing</button><button data-component="faq">FAQ</button><button data-component="footer">Footer</button></div><p class="eyebrow layers-label">LAYERS</p><div id="layers">Select a component to add it.</div></div></aside>
<section class="canvas-area"><div class="canvas-bar"><span id="pageName">Home page</span><div><button data-view="desktop" class="active">Desktop</button><button data-view="tablet">Tablet</button><button data-view="mobile">Mobile</button></div></div><iframe id="builderPreview" title="Live website preview" sandbox="allow-scripts"></iframe></section>
<aside class="properties"><p class="eyebrow">PAGE &amp; PROPERTIES</p><label>Page name<input id="pageTitle" value="Home"></label><label>Accent color<input id="accent" type="color" value="#ffffff"></label><label>Corner radius<input id="radius" type="range" min="0" max="32" value="16"></label><p class="property-note">Adjustments apply to the local preview. Publishing is disabled until a deployment provider is connected.</p><a class="btn btn-ghost btn-block" href="./code.html">Open in Code</a></aside></main>
<script>const frame=document.querySelector('#builderPreview'),prompt=document.querySelector('#buildPrompt'),status=document.querySelector('#buildStatus'),layers=document.querySelector('#layers'),history=[];let html=localStorage.getItem('tg_code_draft')||'<!doctype html><html><head><style>:root{--accent:#fff;--radius:16px}*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:system-ui}section,nav,footer{padding:56px max(28px,8vw)}nav{display:flex;justify-content:space-between;border-bottom:1px solid #292929}button{background:var(--accent);border:0;border-radius:var(--radius);padding:12px 16px}h1{font-size:clamp(40px,8vw,90px);letter-spacing:-.07em;max-width:760px}.hero{min-height:65vh;display:grid;align-content:center}.muted{color:#aaa}</style></head><body><nav><b>Your Studio</b><span>Work · About · Contact</span></nav><section class="hero"><p class="muted">THE TECH GUIDER AI</p><h1>Start shaping your next big idea.</h1><button>Get started</button></section></body></html>';function draw(){frame.srcdoc=html;localStorage.setItem('tg_code_draft',html)}function add(name,content){history.push(html);html=html.replace('</body>',content+'</body>');layers.innerHTML+=`<button class="layer">${name}</button>`;draw()}document.querySelector('#buildBtn').onclick=async()=>{if(!prompt.value.trim())return;status.textContent='Generating with your selected AI model…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({modelId:'guider-flash',message:`Return only a complete single-file responsive HTML website with embedded CSS and JavaScript. Request: ${prompt.value}`})}),d=await r.json();if(!r.ok)throw Error(d.error);history.push(html);html=d.reply.replace(/^\`\`\`(?:html)?\s*|\`\`\`$/g,'');draw();status.textContent='Generated. Open Manual to refine it.'}catch(e){status.textContent=e.message}};document.querySelectorAll('[data-component]').forEach(b=>b.onclick=()=>{const n=b.dataset.component,blocks={nav:'<nav><b>Brand</b><span>Home · Work · Contact</span></nav>',hero:'<section class="hero"><h1>A better way to tell your story.</h1><button>Get started</button></section>',cards:'<section><h2>Built for momentum</h2><div class="cards"><article>Fast</article><article>Flexible</article><article>Focused</article></div></section>',pricing:'<section><h2>Simple pricing</h2><button>Choose your plan</button></section>',faq:'<section><h2>Frequently asked questions</h2><p class="muted">Everything you need to get started.</p></section>',footer:'<footer>© Your Studio</footer>'};add(n,blocks[n])});document.querySelector('#undo').onclick=()=>{if(history.length){html=history.pop();draw()}};document.querySelector('#save').onclick=()=>{localStorage.setItem('tg_code_draft',html);status.textContent='Saved locally.'};document.querySelector('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='website.html';a.click()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');frame.className=b.dataset.view});document.querySelector('#accent').oninput=e=>{html=html.replace(/--accent:[^;}]+/, '--accent:'+e.target.value);draw()};document.querySelector('#radius').oninput=e=>{html=html.replace(/--radius:[^;}]+/, '--radius:'+e.target.value+'px');draw()};document.querySelector('#pageTitle').oninput=e=>document.querySelector('#pageName').textContent=e.target.value+' page';document.querySelectorAll('.builder-tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.builder-tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');aiPanel.hidden=b.dataset.tab!=='ai';manualPanel.hidden=b.dataset.tab!=='manual'});draw()</script></body></html>
