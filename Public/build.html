<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build — The Tech Guider AI</title><link rel="icon" href="./logo.png"><link rel="stylesheet" href="./style.css"></head><body class="app build-v2">
<header class="build-top"><a class="brand" href="./chat.html"><img src="./logo.png" alt="">The Tech Guider AI <span>/ Build</span></a><div class="build-top-actions"><span class="ready-dot">● Workspace ready</span><button class="icon-button" id="refresh" aria-label="Refresh preview">↻</button><label class="build-path"><span>⌁</span><input value="/" aria-label="Preview path"></label><button class="icon-button" id="openPreview" aria-label="Open preview">↗</button></div></header>
<main class="build-shell"><aside class="build-assistant"><div class="assistant-head"><div><p class="eyebrow">AI BUILD ASSISTANT</p><h1>Build with Guider</h1></div><button class="icon-button compact" id="clearBuild" aria-label="Clear build chat">×</button></div><div class="build-messages" id="buildMessages" aria-live="polite"></div><section class="change-section" id="changes" hidden><div class="section-head"><b>Code changes</b><button id="revertBuild">Revert</button></div><div id="changedFiles"></div><button id="applyBuild" class="apply-changes">Apply changes <span>↵</span></button></section><form class="build-composer" id="buildForm"><textarea id="buildPrompt" rows="1" placeholder="Ask for a change…" aria-label="Ask Guider to build"></textarea><div><button type="button" class="tiny-icon" id="buildAttach" title="Attach file">⌇</button><button type="button" class="tiny-icon" id="buildVoice" title="Voice input">◉</button><select id="buildModel" aria-label="Choose model"></select><button class="build-send" id="buildBtn" aria-label="Send build request">↑</button></div></form></aside>
<section class="preview-workspace"><nav class="preview-tabs"><button class="active" data-screen="preview">▣ Preview</button><button data-screen="code">&lt;/&gt; Code</button><span></span><button class="git-button" title="GitHub connection unavailable">◉ GitHub</button></nav><div class="preview-stage"><div class="browser-frame" id="browserFrame"><div class="browser-chrome"><i></i><i></i><i></i><span>Your project</span></div><iframe id="builderPreview" title="Live generated website" sandbox="allow-scripts"></iframe><pre id="buildCode" hidden></pre></div></div></section></main>
<footer class="build-bottom"><div class="view-switch"><button class="active" data-screen="code">&lt;/&gt; Code</button><button data-screen="preview">▣ Preview</button></div><div class="viewport-switch"><button class="active" data-view="desktop" title="Desktop">▰</button><button data-view="tablet" title="Tablet">▯</button><button data-view="mobile" title="Mobile">▯</button></div><div class="build-actions"><button id="templateBtn">✧ Template</button><button id="downloadBtn">⇩ Download</button><button id="shareBtn">⇧ Share</button><button id="copyBtn">⌘ Copy</button><button class="deploy" title="Deployment integration is not connected">↗ Deploy</button></div></footer><input id="buildFile" type="file" accept=".txt,.md,.html,.css,.js" hidden>
<script>const $=s=>document.querySelector(s),frame=$('#builderPreview'),code=$('#buildCode'),messages=$('#buildMessages'),prompt=$('#buildPrompt'),changes=$('#changes'),files=$('#changedFiles');let html=localStorage.getItem('tg_code_draft')||'<!doctype html><html><head><style>body{margin:0;display:grid;min-height:100vh;place-items:center;background:#0b1020;color:#f8fafc;font-family:system-ui}main{text-align:center;padding:48px}h1{font-size:clamp(38px,7vw,76px);margin:0 0 14px}p{color:#a7b5d1}button{padding:12px 18px;border:0;border-radius:8px;background:#2563eb;color:#fff}</style></head><body><main><p>THE TECH GUIDER AI</p><h1>Build something remarkable.</h1><p>Your live preview is ready for its first prompt.</p><button>Get started</button></main></body></html>',previous=html;function draw(){frame.srcdoc=html;code.textContent=html;localStorage.setItem('tg_code_draft',html)}function message(role,text){const el=document.createElement('article');el.className='build-message '+role;el.innerHTML=`<small>${role==='user'?'YOU':'GUIDER'}</small><p></p>`;el.querySelector('p').textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight;return el}function fileChanges(){changes.hidden=false;files.innerHTML='<button class="changed-file"><span>⌘</span><b>index.html</b><em>+42 / −8</em></button>'}async function models(){try{const r=await fetch('/api/models',{credentials:'include'}),d=await r.json();$('#buildModel').innerHTML=d.models.map(m=>`<option value="${m.id}" ${m.locked?'disabled':''}>${m.locked?'🔒 ':''}${m.name}</option>`).join('')}catch{$('#buildModel').innerHTML='<option value="guider-flash">Guider Flash</option>'}}$('#buildForm').onsubmit=async e=>{e.preventDefault();const text=prompt.value.trim();if(!text)return;message('user',text);prompt.value='';const pending=message('assistant','Thinking…');$('#buildBtn').disabled=true;try{const r=await fetch('/api/chat',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({modelId:$('#buildModel').value,message:`Return only a complete responsive HTML document with embedded CSS and JS. Create or revise this website: ${text}. Existing HTML: ${html}`})}),d=await r.json();if(!r.ok)throw Error(d.error);previous=html;html=d.reply.replace(/^\s*```(?:html)?\s*|\s*```\s*$/g,'');draw();pending.querySelector('p').textContent='I prepared the updated page. Review it in Preview, then apply or continue refining.';fileChanges()}catch(x){pending.querySelector('p').textContent=x.message}finally{$('#buildBtn').disabled=false}};document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-screen]').forEach(x=>x.classList.toggle('active',x.dataset.screen===b.dataset.screen));const preview=b.dataset.screen==='preview';frame.hidden=!preview;code.hidden=preview});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));$('#browserFrame').className='browser-frame '+b.dataset.view});$('#refresh').onclick=draw;$('#revertBuild').onclick=()=>{html=previous;draw();changes.hidden=true};$('#applyBuild').onclick=()=>{changes.hidden=true;message('assistant','Changes applied to your local project draft.')};$('#downloadBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='the-tech-guider-project.html';a.click()};$('#copyBtn').onclick=async()=>{await navigator.clipboard.writeText(html);$('#copyBtn').textContent='✓ Copied';setTimeout(()=>$('#copyBtn').textContent='⌘ Copy',1200)};$('#shareBtn').onclick=async()=>{await navigator.clipboard.writeText(location.href);$('#shareBtn').textContent='✓ Link copied';setTimeout(()=>$('#shareBtn').textContent='⇧ Share',1200)};$('#openPreview').onclick=()=>{const w=window.open();w.document.write(html);w.document.close()};$('#buildAttach').onclick=()=>$('#buildFile').click();$('#buildFile').onchange=async e=>{const f=e.target.files[0];if(f)prompt.value+=' Attached '+f.name+': '+(await f.text()).slice(0,5000)};$('#buildVoice').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Voice input is supported in Chrome and Edge.');const r=new R();r.onresult=e=>{prompt.value=e.results[0][0].transcript;prompt.focus()};r.start()};$('#clearBuild').onclick=()=>{messages.innerHTML='';message('assistant','Fresh build conversation. What should we make?')};$('#templateBtn').onclick=()=>{prompt.value='Create a premium landing page for ';prompt.focus()};let workspaceUser=null;async function workspaceAuth(){try{workspaceUser=(await fetch('/api/auth/me',{credentials:'include'}).then(r=>r.json())).user}catch{} }document.addEventListener('click',e=>{const button=e.target.closest('button');if(button&&!workspaceUser){e.preventDefault();e.stopImmediatePropagation();alert('Sign up to use Build.');location.assign('./signup.html?next='+encodeURIComponent(location.pathname));}},true);workspaceAuth();models();draw();</script></body></html>
