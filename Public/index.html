<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build Web — The Tech Guider AI</title><link rel="stylesheet" href="./style.css"></head><body class="app"><main class="builder-page"><a class="brand" href="./chat.html"><img src="./logo.png" class="logo-img" alt="logo">The Tech Guider <span> / Build</span></a><section class="builder-hero"><p class="eyebrow">WEB BUILDER</p><h1>Describe the website you want to make.</h1><p>Get a responsive HTML, CSS and JavaScript starter you can continue editing in Code.</p><textarea id="buildPrompt" placeholder="Example: Create a premium portfolio for a freelance web designer with a dark hero, services, projects and contact form."></textarea><div><button class="btn btn-primary" id="buildBtn">Generate website starter →</button><a class="btn btn-ghost" href="./code.html">Open Code workspace</a></div></section><section class="builder-result" id="buildResult" hidden><div class="result-head"><b>Generated starter</b><button class="btn btn-ghost" id="sendToCode">Open in Code</button></div><pre><code id="buildCode"></code></pre></section></main><script>const p=document.querySelector('#buildPrompt'),b=document.querySelector('#buildBtn'),r=document.querySelector('#buildResult'),c=document.querySelector('#buildCode');b.onclick=async()=>{if(!p.value.trim())return;p.disabled=true;b.textContent='Designing…';try{const q=`Create a complete single-file responsive website. Return only HTML with embedded CSS and JavaScript. User request: ${p.value}`;const x=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({message:q,modelId:'guider-flash'})});const raw=await x.text();const d=raw?JSON.parse(raw):{};if(!x.ok)throw Error(d.error||'Generator is unavailable.');c.textContent=d.reply.replace(/^```html\s*|```$/g,'');r.hidden=false;localStorage.setItem('tg_code_draft',c.textContent)}catch(e){alert(e.message)}finally{p.disabled=false;b.textContent='Generate website starter →'}};document.querySelector('#sendToCode').onclick=()=>location.href='./code.html';</script></body></html>
