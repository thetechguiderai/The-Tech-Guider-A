<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — The Tech Guider AI</title><link rel="icon" href="./logo.png"><link rel="stylesheet" href="./style.css"></head><body class="landing"><header class="nav"><a href="/" class="logo"><img src="./logo.png" class="logo-img" alt="The Tech Guider AI">The Tech Guider AI</a></header><main class="auth-wrap"><section class="auth-card google-auth"><img src="./logo.png" class="auth-logo" alt=""><p class="eyebrow">THE TECH GUIDER AI</p><h1>Create your account</h1><p class="auth-sub">Use Google or create an account with email and password.</p><p id="formError" class="form-error" hidden></p><a class="btn btn-primary btn-block oauth-btn" href="/api/auth/google"><span class="google-mark">G</span> Continue with Google</a><p class="auth-divider">or</p><form id="signupForm"><label class="field">Name<input id="name" autocomplete="name"></label><label class="field">Email<input id="email" type="email" autocomplete="email" required></label><label class="field">Password<input id="password" type="password" autocomplete="new-password" minlength="8" required></label><button class="btn btn-primary btn-block" type="submit">Create account</button></form><p class="auth-alt">Already have an account? <a href="./login.html">Sign in</a></p></section></main><script>const $=s=>document.querySelector(s),error=$('#formError');$('#signupForm').onsubmit=async e=>{e.preventDefault();error.hidden=true;try{const r=await fetch('/api/auth/signup',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#name').value,email:$('#email').value,password:$('#password').value})}),d=await r.json();if(!r.ok)throw Error(d.error);location.assign(new URLSearchParams(location.search).get('next')||'./chat.html')}catch(x){error.textContent=x.message;error.hidden=false}}</script></body></html>
