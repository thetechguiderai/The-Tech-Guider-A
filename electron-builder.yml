appId: com.thetechguider.ai
productName: The Tech Guider AI
directories:
  buildResources: desktop/build
  output: release
files:
  - desktop/**/*
  - Server/**/*
  - Public/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: Public/logo.png
nsis:
  artifactName: The-Tech-Guider-AI-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
